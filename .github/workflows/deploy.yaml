name: CI/CD Pipeline

on:
  push:
    branches: [ "testing", "staging", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Go Service Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: myintmyatdev/caloire-snap-user-svc:${{ github.sha }}

      - name: Determine Target Environment & Branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "TARGET_BRANCH=main" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "TARGET_BRANCH=staging" >> $GITHUB_ENV
          else
            echo "ENV_NAME=testing" >> $GITHUB_ENV
            echo "TARGET_BRANCH=testing" >> $GITHUB_ENV
          fi

      - name: Checkout Infra / GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: Geekzix/calorie-snap-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo
          ref: ${{ env.TARGET_BRANCH }}

      - name: Update Helm values file tag in Infra Repo
        uses: datamonsters/replace-action@v2
        with:
          files: 'infra-repo/helm/user-svc/values.yaml'
          replacements: 'tag="${{ github.sha }}"'

      - name: Commit and push updated image tag to Infra Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository_path: infra-repo
          commit_message: "chore(user-svc-${{ env.ENV_NAME }}): update image tag to ${{ github.sha }} [skip ci]"
          branch: ${{ env.TARGET_BRANCH }}
