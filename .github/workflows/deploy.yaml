name: CI/CD Pipeline

on:
  push:
    branches: [ "testing", "staging", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Go Service Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: myintmyatdev/caloire-snap-user-svc:${{ github.sha }}

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
          else
            echo "ENV_NAME=testing" >> $GITHUB_ENV
          fi

      - name: Checkout Infra / GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: Geekzix/calorie-snap-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo
          ref: ${{ github.ref_name }}

      - name: Update Helm values file tag using sed
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' infra-repo/helm/user-svc/values.yaml

      - name: Commit and push updated image tag to Infra Repo
        run: |
          cd infra-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/Geekzix/calorie-snap-infra.git
          git add helm/user-svc/values.yaml
          git commit -m "chore(user-svc-${{ env.ENV_NAME }}): update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
